<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .head{
        background-color: rgb(11, 53, 23);
        display: flex;
        justify-content: space-between;
        padding: 30px;
    }
    *{
        margin: 0;
        padding: 0;
    }
    .logo{
        color: white;
        font-size: 25px;
    }
    .links a{
        color: white;
        text-decoration: none;
        font-size: 20px;
        margin-left: 15px;

    }
    .links a:hover{
        color: rgb(100, 146, 30);
    }
    .logout button{
        background-color: rgb(71, 104, 22);
        width: 80px;
        border: none;
        border-radius: 40px;
        padding: 10px;
    }
    .logout button:hover{
        background-color: rgb(146, 179, 29);
        color: white;
    }
    .cls{
        text-align: center;
        margin-top: 15px;
    }
    p{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 15px;
    }
    form{
    padding: 30px;
    width: 400px;
    margin: auto;
    margin-top: 200px;
    border-radius: 20px;
    box-shadow: 0px 0px 12px gray;
    text-align: center;
    margin-top: 50px;
}
input[type="text"],[type="email"],[type="tel"],[type="textarea"],select,textarea{
    padding: 10px;
    width: 90%;
    margin-top: 10px;
    margin-bottom: 8px;
}
button{
    padding: 7px;
    width: 89%;
    margin-top: 10px;
    background-color: rgb(0, 0, 0);
    color: white;
}
.main{
        display: flex;
        justify-content: center;
        margin: 150px;
        margin-top: 40px;
        

    }
    .features{
        width: 70px;
        text-align: center;
        padding: 20px;
        box-shadow: 0 0 20px black;
        border-radius: 20px;
        width: 1000px;
        margin: 50px;
        background-color: aliceblue;
        
    }
    .features img{
        width: 100px;
    }
    .features h3{
        margin-bottom: 10px;
        margin-top: 10px;
    }
</style>
<body>
    <div class="head">
    <div class="logo">MyWebsite</div>

    <div class="links">
        <a href="index.html">Home</a>
        <a href="aboutt.html">About</a>
        <a href="service.html">Services</a>
        <a href="contact.html">Contact</a>
    </div>
    <div class="logout">
        <button>logout</button>
    </div>
    </div>
    <div class="cls">
        <h1>Contact Us</h1><br>
        <p>Have qustions?We'd love to hear from you.</p>
    </div>
    <form> 
    <h1>Send Message</h1><br>
        <input type="text" name="name" placeholder="your name"><br>
        <input type="email" name="email" placeholder="your Email"><br>
        <input type="tel" name="phone" placeholder="phone number"><br>
        <textarea name="text" id="" placeholder="your address"></textarea>
        <button>Send Message</button>
   </form>
   <div class="main">
    <div class="features">
        <img src="https://cdn-icons-png.flaticon.com/128/684/684908.png" alt="">
        <h3>Address</h3>
        <p>Kochi,Kerala,India</p>
    </div>
    <div class="features">
        <img src="https://cdn-icons-png.flaticon.com/128/732/732200.png" alt="">
        <h3>Email</h3>
        <p>mywebsite@gmail.com</p>
    </div>
    <div class="features">
        <img src="https://cdn-icons-png.flaticon.com/128/724/724664.png" alt="">
        <h3>Phone</h3>
        <p>+91 9876543210</p>
    </div>
   </div>

</html>
